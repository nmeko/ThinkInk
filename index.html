<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThinkInk: AI notes that study with you</title>
    <meta name="description" content="Free, private note-taking with handwriting, lecture recording, [[linked]] notes, AI search and automatic flashcards. Runs in your browser." />
    <meta name="theme-color" content="#2f4ac0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Where this page may load from and talk to. Notes never leave the device except to the services
      listed here, and only when the person uses that feature (see Settings → Privacy).
      Gemini: optional AI · Supabase: optional study hubs (encrypted) · Wikipedia/OpenAlex: Sources search ·
      Hugging Face: on-device AI model download · jsDelivr/naptha: on-device photo reading (OCR) files.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' data: blob: https://generativelanguage.googleapis.com https://*.supabase.co wss://*.supabase.co https://en.wikipedia.org https://api.openalex.org https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ThinkInk needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
